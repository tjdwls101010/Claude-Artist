# Test environment only. The skill itself runs through the PEP 723 header in cli.py.
[project]
name = "claude-artist"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pillow>=11", "numpy>=2", "fonttools>=4.50", "playwright>=1.50"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".claude/skills/imagen/scripts"]
testpaths = ["tests"]
